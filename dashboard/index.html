<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERA-STRIPE · Wildlife Intelligence Platform</title>
<meta name="description" content="AI-powered tiger re-identification and territory monitoring for Pench Tiger Reserve. DINOv2 stripe pattern matching, MegaDetector triage, and real-time alerts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/leaflet.css"/>
<script src="/static/leaflet.js"></script>
<style>
/* ================================================================
   TERA-STRIPE — Tiger Stripe Intelligence Console
   Design B: 3-Column Layout with Re-ID Engine Center Stage
   ================================================================ */
:root {
  --bg-deepest: #060a13;
  --bg-canvas: #080c14;
  --bg-surface: #0e1420;
  --bg-elevated: #131b2a;
  --bg-card: #151f30;
  --bg-hover: #1a2740;
  --bg-input: #111a2b;
  --border-subtle: rgba(255,255,255,0.06);
  --border-medium: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.16);
  --accent-green: #22c55e;
  --accent-green-dim: rgba(34,197,94,0.15);
  --accent-red: #ef4444;
  --accent-red-dim: rgba(239,68,68,0.15);
  --accent-amber: #f59e0b;
  --accent-amber-dim: rgba(245,158,11,0.12);
  --accent-orange: #f97316;
  --accent-orange-dim: rgba(249,115,22,0.12);
  --accent-blue: #3b82f6;
  --accent-blue-dim: rgba(59,130,246,0.15);
  --accent-purple: #a855f7;
  --accent-pink: #ec4899;
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --text-dim: #475569;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.5);
  --font-sans: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --stripe-gradient: linear-gradient(90deg, #f97316, #f59e0b, #f97316);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-sans);
  background: var(--bg-canvas);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
}

/* ── ICON SIDEBAR ──────────────────────────────── */
.icon-sidebar {
  position: fixed;
  left: 0; top: 0; bottom: 0;
  width: 52px;
  background: var(--bg-deepest);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  z-index: 100;
}
.icon-sidebar .logo {
  width: 32px; height: 32px;
  margin-bottom: 12px;
  cursor: pointer;
}
.icon-sidebar .logo svg { width: 100%; height: 100%; }
.icon-sidebar .nav-icons { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md);
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.2s;
  position: relative;
  border: none; background: none;
}
.nav-icon:hover { color: var(--text-secondary); background: rgba(255,255,255,0.04); }
.nav-icon.active { color: var(--accent-amber); background: var(--accent-amber-dim); }
.nav-icon svg { width: 20px; height: 20px; }
.nav-icon .badge {
  position: absolute; top: 4px; right: 4px;
  background: var(--accent-red);
  color: white; font-size: 9px; font-weight: 700;
  min-width: 14px; height: 14px;
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
  padding: 0 3px;
}
.nav-icon .tooltip-text {
  position: absolute; left: 52px; top: 50%; transform: translateY(-50%);
  background: var(--bg-card); color: var(--text-primary);
  padding: 4px 10px; border-radius: var(--radius-sm);
  font-size: 12px; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity 0.15s;
  border: 1px solid var(--border-medium);
  z-index: 200;
}
.nav-icon:hover .tooltip-text { opacity: 1; }

/* ── MAIN LAYOUT ──────────────────────────────── */
.main-wrapper {
  margin-left: 52px;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── HEADER ──────────────────────────────── */
.header {
  background: var(--bg-deepest);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0 16px;
  display: flex;
  align-items: center;
  height: 52px;
  gap: 12px;
  flex-shrink: 0;
}
.header-brand {
  display: flex; align-items: center; gap: 8px;
  margin-right: 8px;
}
.header-brand h1 {
  font-size: 18px; font-weight: 800;
  letter-spacing: 2px;
  background: var(--stripe-gradient);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stripe-line {
  height: 2px; width: 100%;
  background: var(--stripe-gradient);
  position: absolute; bottom: 0; left: 0;
  opacity: 0.6;
}
.kpi-strip {
  display: flex; gap: 8px; flex: 1; justify-content: center;
}
.kpi-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 6px 16px;
  display: flex; align-items: center; gap: 10px;
  min-width: 140px;
  cursor: pointer;
  transition: all 0.2s;
}
.kpi-card:hover { border-color: var(--border-strong); background: var(--bg-elevated); }
.kpi-card .kpi-icon {
  width: 32px; height: 32px;
  border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.kpi-card .kpi-value {
  font-size: 20px; font-weight: 800;
  font-family: var(--font-mono);
  line-height: 1.1;
}
.kpi-card .kpi-label {
  font-size: 10px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.kpi-card.tigers .kpi-icon { background: var(--accent-amber-dim); color: var(--accent-amber); }
.kpi-card.tigers .kpi-value { color: var(--accent-amber); }
.kpi-card.cameras .kpi-icon { background: var(--accent-green-dim); color: var(--accent-green); }
.kpi-card.cameras .kpi-value { color: var(--accent-green); }
.kpi-card.sightings .kpi-icon { background: var(--accent-blue-dim); color: var(--accent-blue); }
.kpi-card.sightings .kpi-value { color: var(--accent-blue); }
.kpi-card.alerts .kpi-icon { background: var(--accent-red-dim); color: var(--accent-red); }
.kpi-card.alerts .kpi-value { color: var(--accent-red); }

.header-actions {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto;
}
.search-box {
  background: var(--bg-input);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 6px 12px;
  color: var(--text-primary);
  font-size: 12px;
  width: 160px;
  font-family: var(--font-sans);
  outline: none;
}
.search-box:focus { border-color: var(--accent-amber); }
.search-box::placeholder { color: var(--text-dim); }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  background: var(--accent-green-dim);
  color: var(--accent-green);
  padding: 4px 12px;
  border-radius: 100px;
  font-size: 11px; font-weight: 700;
  letter-spacing: 1px;
}
.live-dot {
  width: 6px; height: 6px;
  background: var(--accent-green);
  border-radius: 50%;
  animation: pulse-dot 1.5s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
  50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(34,197,94,0); }
}
.profile-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; color: var(--text-secondary);
  cursor: pointer; font-size: 12px; padding: 4px;
}
.profile-avatar {
  width: 28px; height: 28px;
  background: var(--accent-amber);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 11px; color: #000;
}

/* ── THREE-COLUMN MAIN ──────────────────── */
.content-area {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 1px;
  background: var(--border-subtle);
  overflow: hidden;
}
.column {
  background: var(--bg-canvas);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.column-header {
  padding: 10px 14px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.column-header .header-icon { color: var(--accent-amber); }
.column-body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}
.column-body::-webkit-scrollbar { width: 4px; }
.column-body::-webkit-scrollbar-track { background: transparent; }
.column-body::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 2px; }

/* ── MAP COLUMN ──────────────────── */
#map {
  width: 100%;
  height: 100%;
  background: var(--bg-surface);
}
.leaflet-container { background: var(--bg-surface) !important; }
.map-zone-label {
  background: rgba(8,12,20,0.85) !important;
  border: 1px solid var(--border-medium) !important;
  border-radius: var(--radius-sm) !important;
  padding: 4px 8px !important;
  color: var(--text-primary) !important;
  font-family: var(--font-sans) !important;
  font-size: 11px !important;
  font-weight: 600 !important;
  box-shadow: var(--shadow-lg) !important;
  white-space: nowrap !important;
}
.map-zone-count {
  font-size: 10px; color: var(--text-muted);
  font-weight: 400;
}
.map-overlay {
  position: absolute; z-index: 800;
  background: rgba(8,12,20,0.88);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-md);
  padding: 8px 10px;
  font-size: 10px;
  color: var(--text-secondary);
}
.map-overlay.legend { bottom: 8px; left: 8px; }
.map-overlay.zones { top: 8px; right: 8px; }
.legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.legend-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}

/* ── RE-ID COLUMN ──────────────────── */
.reid-header-bar {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.reid-model-badge {
  background: linear-gradient(135deg, rgba(249,115,22,0.15), rgba(245,158,11,0.15));
  color: var(--accent-orange);
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 10px;
  font-weight: 600;
  font-family: var(--font-mono);
  border: 1px solid rgba(249,115,22,0.2);
}
.reid-stats {
  margin-left: auto;
  font-size: 10px;
  color: var(--text-muted);
  font-family: var(--font-mono);
}
.reid-match-card {
  margin: 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 10px;
  transition: border-color 0.2s;
}
.reid-match-card:hover { border-color: var(--border-strong); }
.reid-match-card.featured {
  border-color: rgba(249,115,22,0.3);
  background: linear-gradient(135deg, var(--bg-surface), rgba(249,115,22,0.03));
}
.reid-comparison {
  display: flex;
  align-items: center;
  gap: 8px;
}
.reid-crop-container {
  flex: 1;
  text-align: center;
}
.reid-crop-label {
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.reid-crop-img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
}
.reid-crop-id {
  font-size: 9px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.reid-arrow {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.reid-score {
  width: 44px; height: 44px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800;
  font-family: var(--font-mono);
  border: 2px solid;
}
.reid-score.high { border-color: var(--accent-green); color: var(--accent-green); background: var(--accent-green-dim); }
.reid-score.medium { border-color: var(--accent-amber); color: var(--accent-amber); background: var(--accent-amber-dim); }
.reid-score.low { border-color: var(--accent-red); color: var(--accent-red); background: var(--accent-red-dim); }
.reid-arrow-line {
  color: var(--text-dim);
  font-size: 16px;
}
.reid-decision {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border-subtle);
}
.reid-decision-badge {
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font-mono);
  padding: 2px 8px;
  border-radius: 100px;
  letter-spacing: 0.5px;
}
.reid-decision-badge.auto-match { background: var(--accent-green-dim); color: var(--accent-green); }
.reid-decision-badge.review { background: var(--accent-amber-dim); color: var(--accent-amber); }
.reid-decision-badge.new-individual { background: var(--accent-orange-dim); color: var(--accent-orange); }
.reid-decision-info {
  font-size: 10px;
  color: var(--text-muted);
}
.reid-gallery-stats {
  margin: 8px;
  padding: 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  text-align: center;
}
.reid-stat-item .stat-value {
  font-size: 18px;
  font-weight: 800;
  font-family: var(--font-mono);
}
.reid-stat-item .stat-label {
  font-size: 9px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.reid-stat-item.green .stat-value { color: var(--accent-green); }
.reid-stat-item.amber .stat-value { color: var(--accent-amber); }
.reid-stat-item.orange .stat-value { color: var(--accent-orange); }

/* ── OPERATIONS COLUMN ──────────────────── */
.ops-section {
  border-bottom: 1px solid var(--border-subtle);
}
.ops-section-header {
  padding: 10px 14px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer;
}
.ops-section-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px;
}
.ops-section-count {
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-muted);
  background: var(--bg-surface);
  padding: 1px 6px;
  border-radius: 100px;
}
.ops-section-body { padding: 0 10px 10px; }

/* Alert items */
.alert-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px;
  margin-bottom: 6px;
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  border-left: 3px solid transparent;
  transition: all 0.2s;
}
.alert-item:hover { background: var(--bg-elevated); }
.alert-item.critical { border-left-color: var(--accent-red); }
.alert-item.warning { border-left-color: var(--accent-amber); }
.alert-item.info { border-left-color: var(--accent-blue); }
.alert-item.ack { opacity: 0.5; }
.alert-type {
  font-size: 10px;
  font-weight: 700;
  font-family: var(--font-mono);
  letter-spacing: 0.5px;
}
.alert-item.critical .alert-type { color: var(--accent-red); }
.alert-item.warning .alert-type { color: var(--accent-amber); }
.alert-item.info .alert-type { color: var(--accent-blue); }
.alert-desc {
  font-size: 11px;
  color: var(--text-secondary);
  margin: 2px 0;
  line-height: 1.4;
}
.alert-time {
  font-size: 9px;
  color: var(--text-dim);
  font-family: var(--font-mono);
}
.alert-actions {
  display: flex; gap: 4px; margin-top: 4px;
}
.btn-xs {
  font-size: 9px;
  padding: 2px 8px;
  border-radius: 100px;
  border: 1px solid var(--border-medium);
  background: none;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-sans);
}
.btn-xs:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.btn-xs.primary { border-color: var(--accent-amber); color: var(--accent-amber); }
.btn-xs.primary:hover { background: var(--accent-amber-dim); }

/* HITL items */
.hitl-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  margin-bottom: 4px;
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.2s;
}
.hitl-item:hover { background: var(--bg-elevated); }
.hitl-thumb {
  width: 36px; height: 28px;
  object-fit: cover;
  border-radius: 3px;
  background: var(--bg-card);
}
.hitl-info { flex: 1; min-width: 0; }
.hitl-id { font-size: 10px; font-family: var(--font-mono); color: var(--text-secondary); }
.hitl-candidate { font-size: 9px; color: var(--text-muted); }
.hitl-status {
  font-size: 9px; font-weight: 600;
  padding: 1px 6px; border-radius: 100px;
  background: var(--accent-amber-dim); color: var(--accent-amber);
}

/* Quarantine */
.quarantine-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.quarantine-stat {
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  text-align: center;
}
.quarantine-stat .q-value {
  font-size: 16px; font-weight: 800;
  font-family: var(--font-mono);
  color: var(--text-primary);
}
.quarantine-stat .q-label {
  font-size: 9px; color: var(--text-muted);
  text-transform: uppercase;
}
.quarantine-actions {
  display: flex; gap: 6px; margin-top: 8px;
}
.btn-sm {
  flex: 1;
  font-size: 10px;
  padding: 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-medium);
  background: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-family: var(--font-sans);
  font-weight: 600;
  transition: all 0.2s;
  text-align: center;
}
.btn-sm:hover { background: var(--bg-hover); }
.btn-sm.danger { border-color: var(--accent-red); color: var(--accent-red); }
.btn-sm.danger:hover { background: var(--accent-red-dim); }

/* Export buttons */
.export-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
}
.export-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 8px 4px;
  color: var(--text-secondary);
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font-sans);
  text-align: center;
}
.export-btn:hover {
  background: var(--bg-elevated);
  border-color: var(--accent-amber);
  color: var(--accent-amber);
}

/* ── BOTTOM STATUS BAR ──────────────────── */
.status-bar {
  height: 24px;
  background: var(--bg-deepest);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 12px 0 66px;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-dim);
  gap: 16px;
  flex-shrink: 0;
}
.status-item { display: flex; align-items: center; gap: 4px; }
.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--accent-green);
}
.status-dot.warn { background: var(--accent-amber); }

/* ── MODAL OVERLAY ──────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-elevated);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-lg);
  width: 90%;
  max-width: 700px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px;
}
.modal-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-close {
  margin-left: auto;
  background: none; border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
}
.modal-close:hover { color: var(--text-primary); }

/* Tiger Detail Modal */
.tiger-detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.tiger-flank-box {
  text-align: center;
}
.tiger-flank-box img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: var(--radius-md);
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
}
.tiger-flank-label {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-top: 4px;
}
.tiger-meta-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.tiger-meta-item {
  background: var(--bg-surface);
  border-radius: var(--radius-sm);
  padding: 8px;
  text-align: center;
}
.tiger-meta-item .meta-value {
  font-size: 16px; font-weight: 700;
  font-family: var(--font-mono);
  color: var(--text-primary);
}
.tiger-meta-item .meta-label {
  font-size: 9px; color: var(--text-muted);
  text-transform: uppercase;
}
.btn-track {
  width: 100%;
  padding: 10px;
  background: var(--accent-amber);
  color: #000;
  border: none;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  margin-top: 12px;
  font-family: var(--font-sans);
  transition: opacity 0.2s;
}
.btn-track:hover { opacity: 0.9; }

/* HITL Review Modal */
.hitl-review-comparison {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 16px;
}
.hitl-review-img {
  flex: 1; text-align: center;
}
.hitl-review-img img {
  width: 100%; max-height: 200px;
  object-fit: cover; border-radius: var(--radius-md);
  background: var(--bg-card);
}
.hitl-review-img .label {
  font-size: 11px; color: var(--text-muted);
  margin-top: 4px;
}
.hitl-review-score {
  font-size: 28px; font-weight: 800;
  font-family: var(--font-mono);
  color: var(--accent-amber);
  text-align: center;
}
.hitl-review-actions {
  display: flex; gap: 8px; margin-top: 16px;
}
.hitl-review-actions button {
  flex: 1;
  padding: 10px;
  border-radius: var(--radius-md);
  border: 1px solid;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: all 0.2s;
}
.btn-confirm {
  background: var(--accent-green-dim);
  border-color: var(--accent-green);
  color: var(--accent-green);
}
.btn-confirm:hover { background: var(--accent-green); color: #000; }
.btn-reject {
  background: var(--accent-red-dim);
  border-color: var(--accent-red);
  color: var(--accent-red);
}
.btn-reject:hover { background: var(--accent-red); color: #fff; }
.btn-skip {
  background: none;
  border-color: var(--border-medium);
  color: var(--text-secondary);
}
.btn-skip:hover { background: var(--bg-hover); }

/* ── ANIMATIONS ──────────────────── */
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.fade-in { animation: fadeIn 0.3s ease forwards; }

/* ── Leaflet overrides ──────────────────── */
.leaflet-tile-pane { filter: saturate(0.3) brightness(0.7); }
.leaflet-control-zoom a {
  background: var(--bg-card) !important;
  color: var(--text-primary) !important;
  border-color: var(--border-medium) !important;
}
</style>

<script>
// ═══════════════════════════════════════════════════════════════════
// TERA-STRIPE Dashboard — Tiger Stripe Intelligence Console
// ═══════════════════════════════════════════════════════════════════

let DATA = null;
let map = null;
let mapLayers = { stations: [], zones: [], sightings: [], trails: [] };

// ── Initialize ──────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  loadData();
  setInterval(loadData, 30000);

  // Nav icon clicks
  document.querySelectorAll('.nav-icon').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-icon').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const view = btn.dataset.view;
      handleNavClick(view);
    });
  });

  // Search
  document.getElementById('global-search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    if (!DATA) return;
    highlightSearch(q);
  });

  // Export buttons
  document.getElementById('export-ntca').addEventListener('click', () => exportReport('ntca'));
  document.getElementById('export-shapefile').addEventListener('click', () => exportReport('shapefile'));
  document.getElementById('export-pdf').addEventListener('click', () => exportReport('pdf'));
});

function handleNavClick(view) {
  if (view === 'hitl') openHITLReview();
  else if (view === 'alerts') scrollToSection('ops-alerts');
  else if (view === 'cameras') openCameraView();
  else if (view === 'reports') openReportsView();
  else if (view === 'settings') openSettingsView();
}

// ── Data Loading ──────────────────────────────
async function loadData() {
  try {
    const res = await fetch('/api/feed');
    DATA = await res.json();
    renderAll();
  } catch (e) {
    console.error('Feed error:', e);
  }
}

function renderAll() {
  if (!DATA) return;
  renderKPIs();
  renderMap();
  renderReID();
  renderAlerts();
  renderHITL();
  renderQuarantine();
  renderStatusBar();
}

// ── KPI Cards ──────────────────────────────
function renderKPIs() {
  const k = DATA.kpi;
  document.getElementById('kpi-tiger-count').textContent = k.tracked_tigers || 0;
  document.getElementById('kpi-camera-count').textContent = k.active_stations || 0;
  document.getElementById('kpi-sighting-count').textContent = k.total_sightings || 0;
  document.getElementById('kpi-alert-count').textContent = k.active_alerts || 0;
  document.getElementById('alert-badge').textContent = k.active_alerts || 0;
  if (k.active_alerts === 0) document.getElementById('alert-badge').style.display = 'none';
  else document.getElementById('alert-badge').style.display = 'flex';
}

// ── Map ──────────────────────────────
function initMap() {
  map = L.map('map', {
    center: [21.72, 79.34],
    zoom: 12,
    zoomControl: true,
    attributionControl: false,
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 18,
  }).addTo(map);
}

function renderMap() {
  // Clear old layers
  Object.values(mapLayers).forEach(arr => { arr.forEach(l => map.removeLayer(l)); arr.length = 0; });

  const stations = DATA.stations || [];
  const zones = DATA.zones || [];
  const tigers = DATA.tigers || [];

  document.getElementById('map-station-count').textContent = `${stations.length} stations`;

  // Zone overlays
  zones.forEach(z => {
    if (!z.lat || !z.lon) return;
    const radius = z.tigers > 6 ? 3500 : z.tigers > 3 ? 2800 : 2000;
    const circle = L.circle([z.lat, z.lon], {
      radius, color: z.color, fillColor: z.color, fillOpacity: 0.12, weight: 1.5, dashArray: '6,4',
    }).addTo(map);
    mapLayers.zones.push(circle);

    const label = L.marker([z.lat, z.lon], {
      icon: L.divIcon({
        className: 'map-zone-label',
        html: `<strong>${z.name}</strong><br><span class="map-zone-count">${z.tigers} Tigers</span>`,
        iconSize: [120, 36],
      })
    }).addTo(map);
    mapLayers.zones.push(label);
  });

  // Station markers
  stations.forEach(s => {
    if (!s.lat || !s.lon) return;
    const color = s.active ? '#22c55e' : '#ef4444';
    const marker = L.circleMarker([s.lat, s.lon], {
      radius: 6, fillColor: color, fillOpacity: 0.9, color: '#fff', weight: 1.5,
    }).addTo(map);
    marker.bindPopup(`
      <div style="font-family:var(--font-sans);font-size:12px;">
        <strong>${s.id}</strong><br>
        ${s.range_name || ''} · ${s.zone}<br>
        Captures: ${s.captures}<br>
        Status: ${s.active ? '🟢 Online' : '🔴 Offline'}
      </div>
    `);
    mapLayers.stations.push(marker);
  });

  // Tiger movement trails (connect tiger sightings across stations)
  const stationCoords = {};
  stations.forEach(s => { if (s.lat && s.lon) stationCoords[s.id] = [s.lat, s.lon]; });

  tigers.forEach(t => {
    const visited = t.stations_visited || [];
    if (visited.length < 2) return;
    const points = visited.map(sid => stationCoords[sid]).filter(Boolean);
    if (points.length < 2) return;
    const trail = L.polyline(points, {
      color: '#f59e0b', weight: 1.5, dashArray: '4,6', opacity: 0.5,
    }).addTo(map);
    trail.bindPopup(`<strong>${t.id}</strong> movement trail`);
    mapLayers.trails.push(trail);
  });

  // Map legend overlay
  let legendEl = document.getElementById('map-legend');
  if (!legendEl) {
    legendEl = document.createElement('div');
    legendEl.id = 'map-legend';
    legendEl.className = 'map-overlay legend';
    document.getElementById('map').parentElement.appendChild(legendEl);
  }
  legendEl.innerHTML = `
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> Camera (Online)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div> Camera (Offline)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> Tiger Trail</div>
    <div class="legend-item"><div class="legend-dot" style="background:transparent;border:1.5px dashed #22c55e"></div> Zone Boundary</div>
  `;
}

// ── Re-ID Engine ──────────────────────────────
function renderReID() {
  const reid = DATA.reid || {};
  const matches = reid.matches || [];
  const body = document.getElementById('reid-body');

  // Stats bar
  document.getElementById('reid-embedding-stats').textContent =
    `${reid.gallery_size || 0} individuals · ${reid.total_embeddings || 0} embeddings · ${reid.embedding_dim || 768}d`;

  // Gallery stats
  let html = `<div class="reid-gallery-stats">
    <div class="reid-stat-item green"><div class="stat-value">${reid.auto_match_count || 0}</div><div class="stat-label">Auto-Match</div></div>
    <div class="reid-stat-item amber"><div class="stat-value">${reid.review_count || 0}</div><div class="stat-label">Review</div></div>
    <div class="reid-stat-item orange"><div class="stat-value">${reid.new_individual_count || 0}</div><div class="stat-label">New Individual</div></div>
  </div>`;

  // Match cards
  matches.forEach((m, i) => {
    const scoreClass = m.decision === 'AUTO_MATCH' ? 'high' : m.decision === 'REVIEW' ? 'medium' : 'low';
    const decisionClass = m.decision === 'AUTO_MATCH' ? 'auto-match' : m.decision === 'REVIEW' ? 'review' : 'new-individual';
    const decisionLabel = m.decision.replace('_', ' ');
    const isSameTiger = m.query_tiger === m.gallery_tiger;

    html += `
    <div class="reid-match-card ${i === 0 ? 'featured' : ''} fade-in" style="animation-delay:${i*50}ms">
      <div class="reid-comparison">
        <div class="reid-crop-container">
          <div class="reid-crop-label">Query</div>
          ${m.query_crop ? `<img src="${m.query_crop}" class="reid-crop-img" alt="Query" onerror="this.style.display='none'">` : '<div class="reid-crop-img" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;">No crop</div>'}
          <div class="reid-crop-id">${m.query_tiger}</div>
        </div>
        <div class="reid-arrow">
          <div class="reid-arrow-line">→</div>
          <div class="reid-score ${scoreClass}">${(m.similarity).toFixed(2)}</div>
          <div class="reid-arrow-line">→</div>
        </div>
        <div class="reid-crop-container">
          <div class="reid-crop-label">Gallery</div>
          ${m.gallery_crop ? `<img src="${m.gallery_crop}" class="reid-crop-img" alt="Gallery" onerror="this.style.display='none'">` : '<div class="reid-crop-img" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;">No crop</div>'}
          <div class="reid-crop-id">${m.gallery_tiger}</div>
        </div>
      </div>
      <div class="reid-decision">
        <span class="reid-decision-badge ${decisionClass}">${isSameTiger ? '✓ ' : '✗ '}${decisionLabel}</span>
        <span class="reid-decision-info">${m.flank || ''} flank · ${isSameTiger ? 'Same tiger' : 'Different tigers'}</span>
      </div>
    </div>`;
  });

  body.innerHTML = html;
}

// ── Actions ──────────────────────────────
async function acknowledgeAlert(id) {
  try {
    const res = await fetch(`/api/alerts/${id}/acknowledge`, { method: 'POST' });
    const data = await res.json();
    if (data.success) {
      const el = document.getElementById(`alert-${id}`);
      if (el) { el.classList.add('ack'); el.querySelector('.alert-actions')?.remove(); }
      loadData();
    }
  } catch (e) { console.error(e); }
}

function dispatchAlert(id) {
  const el = document.getElementById(`alert-${id}`);
  if (el) {
    el.style.borderLeftColor = 'var(--accent-blue)';
    const actions = el.querySelector('.alert-actions');
    if (actions) actions.innerHTML = '<span style="font-size:9px;color:var(--accent-blue);">📡 Dispatched to patrol team</span>';
  }
}

function openHITLDetail(id) {
  if (!DATA) return;
  const item = DATA.hitl?.find(h => h.id === id);
  if (!item) return;

  document.getElementById('modal-hitl-id').textContent = id;
  document.getElementById('modal-hitl-comparison').innerHTML = `
    <div class="hitl-review-img">
      ${item.queryImg ? `<img src="${item.queryImg}" alt="Query">` : '<div style="height:200px;background:var(--bg-card);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);">No image</div>'}
      <div class="label">Query Image</div>
    </div>
    <div style="text-align:center;">
      <div class="hitl-review-score">${item.sim}</div>
      <div style="font-size:10px;color:var(--text-muted);">Similarity</div>
    </div>
    <div class="hitl-review-img">
      ${item.galleryImg ? `<img src="${item.galleryImg}" alt="Gallery">` : '<div style="height:200px;background:var(--bg-card);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);">No image</div>'}
      <div class="label">Gallery Match · ${item.candidate}</div>
    </div>
  `;
  document.getElementById('modal-hitl-actions').innerHTML = `
    <button class="btn-confirm" onclick="resolveHITL('${id}','CONFIRM')">✓ Confirm Match</button>
    <button class="btn-reject" onclick="resolveHITL('${id}','REJECT')">✗ Reject</button>
    <button class="btn-skip" onclick="resolveHITL('${id}','SKIP')">⏭ Skip</button>
  `;
  openModal('hitl-modal');
}

async function resolveHITL(id, action) {
  try {
    await fetch(`/api/hitl/${id}/resolve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }),
    });
    closeModal('hitl-modal');
    loadData();
  } catch (e) { console.error(e); }
}

function focusTigerOnMap(tiger) {
  if (!DATA || !map) return;
  const stations = DATA.stations || [];

    if (stn && stn.lat && stn.lon) {
      map.setView([stn.lat, stn.lon], 14);
    }
  }
}

function exportReport(type) {
  const names = { ntca: 'NTCA Census Report', shapefile: 'Territory Shapefiles', pdf: 'PDF Briefing' };
  const btn = event?.target;
  if (btn) {
    const orig = btn.textContent;
    btn.textContent = '✓ Generating...';
    btn.style.color = 'var(--accent-green)';
    btn.style.borderColor = 'var(--accent-green)';
    setTimeout(() => {
      btn.textContent = '✓ Downloaded';
      setTimeout(() => { btn.textContent = orig; btn.style.color = ''; btn.style.borderColor = ''; }, 2000);
    }, 1500);
  }
}

function quarantineAction(action) {
  const names = { rollback: 'Rollback', purge: 'Purge' };
  if (confirm(`${names[action]} quarantine? This ${action === 'purge' ? 'permanently deletes' : 'restores'} all quarantined files.`)) {
    // Simulate action
    const body = document.getElementById('quarantine-body');
    body.innerHTML = `<div style="text-align:center;padding:16px;color:var(--accent-green);font-size:12px;">✓ ${names[action]} completed successfully</div>`;
    setTimeout(loadData, 3000);
  }
}

function scrollToSection(id) {
  document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
}

function highlightSearch(query) {
  if (!query) return;
  const tiger = DATA.tigers?.find(t =>
    t.id.toLowerCase().includes(query) || t.name.toLowerCase().includes(query)
  );
  if (tiger) openTigerDetail(tiger.id);
}

// ── Modals ──────────────────────────────
function openModal(id) {
  // Reset hidden elements
  document.getElementById('modal-tiger-status').style.display = '';
  document.getElementById('modal-focus-map').style.display = '';
  document.getElementById(id).classList.add('active');
}
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// ── Utilities ──────────────────────────────
function timeAgo(iso) {
  if (!iso) return '—';
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

document.getElementById('kpi-tigers')?.addEventListener('click', () => {
